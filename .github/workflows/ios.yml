name: iOS

on:
  push:
    branches: [main]
    # Swift Package Manager installs straight from the release tag; the tag run only checks the versions.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    paths: ['sdks/ios/**', 'spec/**', 'Package.swift', '.github/workflows/ios.yml']
  pull_request:
    paths: ['sdks/ios/**', 'spec/**', 'Package.swift', '.github/workflows/ios.yml']
  # Run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test the package
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          xcodebuild test -scheme DataTalksPush-Package -destination "platform=iOS Simulator,name=$device"
      - name: Build the sample
        run: >
          xcodebuild build -project sdks/ios/samples/swiftui/DataTalksPushSample.xcodeproj -scheme DataTalksPushSample
          -destination "generic/platform=iOS Simulator"

  release-check:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: tools/release/check-version.sh "$GITHUB_REF_NAME"
