name: Capacitor

on:
  push:
    branches: [main]
    # A release tag (the plain version, e.g. 0.5.0-beta.1) publishes @datatalks-ab/push-capacitor to npm.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    paths: ['sdks/capacitor/**', 'sdks/android/**', 'sdks/ios/**', '.github/workflows/capacitor.yml']
  pull_request:
    paths: ['sdks/capacitor/**', 'sdks/android/**', 'sdks/ios/**', '.github/workflows/capacitor.yml']
  # Run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The plugin, with the native SDKs it bundles, and both samples' web apps. Capacitor 6's Gradle needs Java 17.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Plugin
        working-directory: sdks/capacitor
        # npm pack runs prepack: the native SDKs are vendored and the plugin built once.
        run: |
          npm ci
          npm pack --dry-run
      - name: Ionic React sample
        working-directory: sdks/capacitor/samples/ionic-react
        run: |
          npm ci
          npm run build
      - name: Plain sample on Android
        working-directory: sdks/capacitor/samples/plain
        run: |
          npm ci
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Plugin
        working-directory: sdks/capacitor
        run: |
          npm ci
          npm run vendor
          npm run build
      - name: Plain sample on the iOS simulator
        working-directory: sdks/capacitor/samples/plain
        run: |
          npm ci
          npx cap sync ios
          xcodebuild build -workspace ios/App/App.xcworkspace -scheme App -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, ios]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: tools/release/check-version.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Publish to npm
        working-directory: sdks/capacitor
        env:
          # Only for the package's first version, before its trusted publisher exists; empty afterwards (see RELEASING.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=beta; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag"
