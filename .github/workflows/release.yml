name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: tools/release/check-version.sh "$GITHUB_REF_NAME"
      # A draft: publish it by hand once every package is out (RELEASING.md).
      - name: Create a draft GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; fi
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --draft $prerelease
