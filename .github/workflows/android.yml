name: Android

on:
  push:
    branches: [main]
    # A release tag (the plain version, e.g. 0.5.0-beta.1) publishes to Maven Central. Path filters don't apply to tags.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    paths: ['sdks/android/**', 'spec/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['sdks/android/**', 'spec/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # publishToMavenLocal builds what Maven Central gets (POM, sources, javadoc), unsigned without the release key.
      - run: ./gradlew --no-daemon :push:testDebugUnitTest :push:lintDebug :samples:compose:assembleDebug :push:publishToMavenLocal

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - run: tools/release/check-version.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish to Maven Central
        working-directory: sdks/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :push:publishToMavenCentral
