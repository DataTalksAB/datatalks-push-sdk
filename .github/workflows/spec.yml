name: Spec

on:
  push:
    branches: [main]
    paths: ['spec/**', '.github/workflows/spec.yml']
  pull_request:
    paths: ['spec/**', '.github/workflows/spec.yml']
  # Run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2 lint spec/openapi/push-v1.yaml
