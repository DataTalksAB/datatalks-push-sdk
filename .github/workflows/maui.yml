name: .NET MAUI

on:
  push:
    branches: [main]
    # A release tag (the plain version, e.g. 0.5.0-beta.1) publishes the three packages to nuget.org.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    paths: ['sdks/maui/**', 'sdks/android/**', 'sdks/ios/**', '.github/workflows/maui.yml']
  pull_request:
    paths: ['sdks/maui/**', 'sdks/android/**', 'sdks/ios/**', '.github/workflows/maui.yml']
  # Run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The wrapper's shared code against a fake platform: no workload, no device.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test sdks/maui/tests/DataTalks.Push.Maui.Tests

  # The bindings over both native SDKs, through the sample for Android and the iOS simulator.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui
      # The runner defaults to its newest Xcode; .NET for iOS builds an app only with the Xcode version it was made for.
      - run: sdks/maui/use-workload-xcode.sh
      - run: sdks/maui/build-native.sh
      - run: dotnet build sdks/maui/samples/maui-app -f net10.0-android
      - run: dotnet build sdks/maui/samples/maui-app -p:TargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
      - run: sdks/maui/pack.sh
      - uses: actions/upload-artifact@v6
        with:
          name: maui-packages
          path: sdks/maui/native/artifacts/nupkg/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, build]
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: tools/release/check-version.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui
      # The runner defaults to its newest Xcode; .NET for iOS builds an app only with the Xcode version it was made for.
      - run: sdks/maui/use-workload-xcode.sh
      - run: sdks/maui/build-native.sh
      - run: sdks/maui/pack.sh
      # nuget.org trusted publishing: a short-lived key for this run, from the policy for this repository and workflow.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        run: >
          dotnet nuget push "sdks/maui/native/artifacts/nupkg/*.nupkg"
          --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
