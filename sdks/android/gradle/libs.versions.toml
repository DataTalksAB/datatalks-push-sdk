[versions]
agp = "8.13.2"
kotlin = "2.2.20"
googleServices = "4.4.4"
mavenPublish = "0.35.0"
# Minimum version: has the FID registration fixes and still allows minSdk 23. An app on 26.x keeps it (26.x needs minSdk 24).
firebaseMessaging = "25.1.3"
androidxCore = "1.13.1"
# Newest WorkManager usable by an app compiling against API 34 (such as Capacitor 6): 2.10.0 and later require compileSdk 35
# in their AAR metadata. An app on a newer WorkManager keeps its own.
work = "2.9.1"
activityCompose = "1.10.1"
composeBom = "2025.08.00"
junit = "4.13.2"
robolectric = "4.15.1"
mockWebServer = "4.12.0"
truth = "1.4.4"
snakeyaml = "2.4"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestExt = "1.2.1"

[libraries]
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockWebServer" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
